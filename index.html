<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <p class="top-label">First to 3 wins</p>
      <h1>Rock &middot; Paper &middot; Scissors</h1>
      <p class="subtitle">Pick your move — beat the computer</p>
    </header>

    <main>
      <details class="rules">
        <summary>How to play</summary>
        <ul>
          <li>✊ Rock crushes ✌️ Scissors</li>
          <li>✌️ Scissors cuts ✋ Paper</li>
          <li>✋ Paper covers ✊ Rock</li>
        </ul>
        <p>Same pick = tie.</p>
      </details>

      <div class="score-container">
        <div class="score-card">
          <span class="label">You</span>
          <span class="score" id="player-score">0</span>
        </div>
        <div class="vs">VS</div>
        <div class="score-card">
          <span class="label">CPU</span>
          <span class="score" id="computer-score">0</span>
        </div>
      </div>

      <section class="options-container">
        <h2>Choose your weapon</h2>
        <div class="btn-container">
          <button id="rock-btn" class="btn">
            <span class="hand">✊</span>
            <span>Rock</span>
          </button>
          <button id="paper-btn" class="btn">
            <span class="hand">✋</span>
            <span>Paper</span>
          </button>
          <button id="scissors-btn" class="btn">
            <span class="hand">✌️</span>
            <span>Scissors</span>
          </button>
        </div>
      </section>

      <div class="results-container">
        <p id="results-msg"></p>
        <p id="winner-msg"></p>
        <button class="btn reset" id="reset-game-btn">Play again?</button>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
